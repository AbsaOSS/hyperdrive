name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-tags: true
          fetch-depth: 0 # Fetch all history for all tags and branches

      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: '1.8'

      - name: Import GPG keys
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          # Configure GPG for CI
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf

          # Import the private key
          echo "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}" | base64 --decode | gpg --batch --import

          # Extract and trust the fingerprint
          FINGERPRINT=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')
          echo "$FINGERPRINT:6:" | gpg --import-ownertrust

          # Set permissions
          chmod 600 ~/.gnupg/*
          chmod 700 ~/.gnupg

          # Restart GPG agent
          gpgconf --kill gpg-agent
          echo RELOADAGENT | gpg-connect-agent

      - name: Create settings.xml
        run: |
          echo "<settings xmlns=\"http://maven.apache.org/SETTINGS/1.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd\">
            <servers>
              <server>
                <id>ossrh</id>
                <username>${{ secrets.OSSRH_USERNAME }}</username>
                <password>${{ secrets.OSSRH_TOKEN }}</password>
              </server>
            </servers>
          </settings>" > $HOME/.m2/settings.xml
      - name: Build and deploy artifact
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_TTY: /dev/console
        run: |
          echo "DEPLOY SPARK-2 / SCALA-2.11 ARTIFACTS"
          mvn scala-cross-build:change-version -Pscala-2.11,spark-2
          mvn -B -e -DskipTests -Dmanual-release -Pdeploy,scala-2.11,spark-2 -Dossrh clean deploy -Dossrh.username=${{ secrets.OSSRH_USERNAME }} -Dossrh.password=${{ secrets.OSSRH_TOKEN }} -Dgpg.passphrase=${{ secrets.MAVEN_GPG_PASSPHRASE }}
          mvn scala-cross-build:restore-version
          git clean -f
          echo "DEPLOY SPARK-2 / SCALA-2.12 ARTIFACTS"
          mvn -B -e -DskipTests -Dmanual-release -Pdeploy,scala-2.12,spark-2 -Dossrh clean deploy -Dossrh.username=${{ secrets.OSSRH_USERNAME }} -Dossrh.password=${{ secrets.OSSRH_TOKEN }} -Dgpg.passphrase=${{ secrets.MAVEN_GPG_PASSPHRASE }}
          echo "DEPLOY SPARK-3 ARTIFACTS"
          cd compatibility_spark-3
          mvn -B -e -DskipTests -Dmanual-release -Pdeploy,scala-2.12,spark-3 -Dossrh clean deploy -Dossrh.username=${{ secrets.OSSRH_USERNAME }} -Dossrh.password=${{ secrets.OSSRH_TOKEN }} -Dgpg.passphrase=${{ secrets.MAVEN_GPG_PASSPHRASE }}
          cd ..
          cd hyperdrive-release_spark-3
          mvn -B -e -DskipTests -Dmanual-release -Pdeploy,scala-2.12,spark-3 -Dossrh clean deploy -Dossrh.username=${{ secrets.OSSRH_USERNAME }} -Dossrh.password=${{ secrets.OSSRH_TOKEN }} -Dgpg.passphrase=${{ secrets.MAVEN_GPG_PASSPHRASE }}



